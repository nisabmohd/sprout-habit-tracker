<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write note · Sprout design</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Lexend,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.h{font-family:Outfit,Lexend,sans-serif}
textarea{font-family:inherit}
textarea:focus{outline:none}
</style>

<style>html,body{margin:0;background:#1a1a1a}body{display:flex;justify-content:center;padding:24px 0}</style>
</head><body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: hsl(38 30% 96%); color: hsl(38 15% 11%); font-family: Lexend, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="padding: 20px 16px 8px 16px; display: flex; align-items: center; gap: 16px">
<a href="#" aria-label="Close" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: hsl(38 28% 91%); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 class="h" style="flex-grow: 1; margin: 0; font-size: 22px; font-weight: 600">New note</h1>
<a href="#" aria-label="Save note" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: hsl(38 48% 30%); color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</a>
</div>

<div style="padding: 8px 16px 0 16px">
<div style="height: 700px; box-sizing: border-box; border-radius: 28px; background: hsl(38 40% 99%); padding: 8px; display: flex; flex-direction: column">
<button aria-label="Change habit" style="height: 68px; flex-shrink: 0; border-radius: 22px; border: none; background: hsl(38 55% 92%); color: hsl(38 15% 11%); display: flex; align-items: center; gap: 14px; padding: 0 16px 0 12px; text-align: left">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: hsl(38 48% 82%); display: flex; align-items: center; justify-content: center">

<div style="width: 22px; height: 22px; display: flex; color: hsl(38 50% 24%)">























<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"></circle><path d="M12 9.5V13l2.5 2M5 3.5L2.5 6M19 3.5L21.5 6"></path></svg>






</div>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600; color: hsl(38 50% 24%)">Wake up at 7</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: hsl(38 8% 36%)">
<span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; background: hsl(38 48% 40%); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="color: hsl(38 50% 24%)">Done · Sunday, 27 Sep</span></span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="hsl(38 50% 24%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<label style="flex-grow: 1; display: flex; flex-direction: column; padding: 20px 16px 16px 16px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Note</span>
<textarea placeholder="How did it go today?" style="flex-grow: 1; border: none; padding: 0; font-size: 18px; line-height: 1.55; resize: none; background: transparent; color: hsl(38 15% 11%); caret-color: hsl(38 48% 40%)">Up before the alarm again. Slept at 10:30 and it really helped.</textarea>
</label>
</div>
</div>
</div>

</body></html>
