<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminder time · Sprout design</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Lexend,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.h{font-family:Outfit,Lexend,sans-serif}
</style>

<style>html,body{margin:0;background:#1a1a1a}body{display:flex;justify-content:center;padding:24px 0}</style>
</head><body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: hsl(38 30% 96%); color: hsl(38 15% 11%); font-family: Lexend, system-ui, sans-serif">
<div aria-hidden="true" style="padding: 32px 16px; display: flex; flex-direction: column; gap: 16px">
<div class="h" style="font-size: 22px; font-weight: 600; padding-left: 64px">New habit</div>
<div style="height: 52px; border-radius: 14px; border: 1px solid hsl(38 14% 84%); margin-left: 68px"></div>
<div style="height: 40px; border-radius: 12px; background: hsl(38 40% 99%)"></div>
<div style="height: 38px; border-radius: 19px; background: hsl(38 40% 99%)"></div>
<div style="height: 40px; border-radius: 20px; border: 1px solid hsl(38 14% 84%)"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(10,14,12,0.45)"></div>

<div role="dialog" aria-label="Reminder time" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: hsl(38 40% 99%); padding: 10px 16px 24px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: hsl(38 14% 84%)"></div>
<span class="h" style="font-size: 22px; font-weight: 600; padding: 8px 4px 0 4px">Reminder time</span>
<div style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 0 16px 0">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<button aria-label="Hour up" style="width: 48px; height: 40px; border: none; background: transparent; color: hsl(38 8% 36%); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<div class="h" style="width: 92px; height: 76px; border-radius: 18px; background: hsl(38 55% 86%); color: hsl(38 55% 14%); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600">09</div>
<button aria-label="Hour down" style="width: 48px; height: 40px; border: none; background: transparent; color: hsl(38 8% 36%); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<span class="h" style="font-size: 40px; font-weight: 600">:</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<button aria-label="Minute up" style="width: 48px; height: 40px; border: none; background: transparent; color: hsl(38 8% 36%); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<div class="h" style="width: 92px; height: 76px; border-radius: 18px; background: hsl(38 28% 91%); color: hsl(38 15% 11%); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600">00</div>
<button aria-label="Minute down" style="width: 48px; height: 40px; border: none; background: transparent; color: hsl(38 8% 36%); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div role="radiogroup" aria-label="AM or PM" style="width: 52px; height: 92px; margin-left: 4px; border: 1px solid hsl(38 8% 36%); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: 1fr 1fr">

<button role="radio" aria-checked="true" style="border: none; border-top: none; background: hsl(38 55% 86%); color: hsl(38 55% 14%); font-size: 14px; font-weight: 600; padding: 0">AM</button>

<button role="radio" aria-checked="false" style="border: none; border-top: 1px solid hsl(38 8% 36%); background: transparent; color: hsl(38 15% 11%); font-size: 14px; font-weight: 600; padding: 0">PM</button>

</div>
</div>
<a href="#" style="height: 48px; border-radius: 24px; background: hsl(38 48% 30%); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Set time</a>
</div>
</div>

</body></html>
