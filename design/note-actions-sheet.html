<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note actions · Sprout design</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Lexend,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.h{font-family:Outfit,Lexend,sans-serif}
</style>

<style>html,body{margin:0;background:#1a1a1a}body{display:flex;justify-content:center;padding:24px 0}</style>
</head><body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: hsl(38 30% 96%); color: hsl(38 15% 11%); font-family: Lexend, system-ui, sans-serif">
<div aria-hidden="true" style="padding: 40px 20px; display: flex; flex-direction: column; gap: 12px">
<div class="h" style="font-size: 28px; font-weight: 600; margin-bottom: 8px">Journal</div>
<div style="height: 120px; border-radius: 24px; background: hsl(38 40% 99%)"></div>
<div style="height: 90px; border-radius: 24px; background: hsl(38 40% 99%)"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(10,14,12,0.45)"></div>

<div role="dialog" aria-label="Note for Read" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: hsl(38 40% 99%); padding: 10px 0 24px 0; display: flex; flex-direction: column">
<div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: hsl(38 14% 84%)"></div>
<div style="padding: 24px 24px 12px 24px; display: flex; flex-direction: column; gap: 4px">
<span class="h" style="font-size: 22px; font-weight: 600">Read</span>
<span style="font-size: 14px; color: hsl(38 8% 36%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Only 8 pages, fell asleep. Start before 10 PM.</span>
</div>
<a href="#" style="height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 24px; font-size: 16px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M14 6l4 4"></path></svg>Edit note</a>
<button style="height: 56px; border: none; background: transparent; color: hsl(38 15% 11%); display: flex; align-items: center; gap: 24px; padding: 0 24px; font-size: 16px; text-align: left"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="18.5" r="2.5"></circle><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"></path></svg>Share</button>
<button style="height: 56px; border: none; background: transparent; color: hsl(0 70% 42%); display: flex; align-items: center; gap: 24px; padding: 0 24px; font-size: 16px; text-align: left"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6 6.5l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 10.5v6M14 10.5v6"></path></svg>Delete note</button>
</div>
</div>

</body></html>
