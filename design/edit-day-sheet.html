<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit a past day · Sprout design</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Lexend,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.h{font-family:Outfit,Lexend,sans-serif}
textarea{font-family:inherit}
</style>

<style>html,body{margin:0;background:#1a1a1a}body{display:flex;justify-content:center;padding:24px 0}</style>
</head><body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: hsl(38 30% 96%); color: hsl(38 15% 11%); font-family: Lexend, system-ui, sans-serif">
<div aria-hidden="true" style="padding: 32px 20px; display: flex; flex-direction: column; gap: 12px">
<div class="h" style="font-size: 28px; font-weight: 600">Habits</div>
<div style="height: 40px; border-radius: 20px; background: hsl(38 28% 91%)"></div>
<div style="height: 118px; border-radius: 24px; background: hsl(38 40% 99%)"></div>
<div style="height: 118px; border-radius: 24px; background: hsl(38 40% 99%); box-shadow: 0 0 0 2px hsl(215 48% 40%)"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(10,14,12,0.45)"></div>

<div role="dialog" aria-label="Edit Read for Friday 25 September" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: hsl(38 40% 99%); padding: 10px 20px 24px 20px; display: flex; flex-direction: column; gap: 20px">
<div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: hsl(38 14% 84%)"></div>

<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 48px; height: 48px; border-radius: 16px; background: hsl(215 55% 92%); display: flex; align-items: center; justify-content: center">


<div style="width: 24px; height: 24px; display: flex; color: hsl(215 50% 24%)">














<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c3-1.2 6-1 9 1v13c-3-2-6-2.2-9-1z"></path><path d="M21 5.5c-3-1.2-6-1-9 1v13c3-2 6-2.2 9-1z"></path><path d="M14.5 9.5c1.3-.5 2.7-.6 4-.3M14.5 12.5c1.3-.5 2.7-.6 4-.3M14.5 15.5c1.3-.5 2.7-.6 4-.3"></path></svg>















</div>

</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<div class="h" style="font-size: 22px; font-weight: 600">Read</div>
<div style="font-size: 14px; color: hsl(38 8% 36%)">Saturday, 26 Sep · goal 20 pages</div>
</div>
<button aria-label="Clear this day's entry for Read" style="height: 40px; flex-shrink: 0; padding: 0 14px 0 10px; border-radius: 20px; border: none; background: hsl(38 28% 91%); color: hsl(38 15% 11%); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
Undo</button>
</div>

<div role="radiogroup" aria-label="Outcome" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid hsl(38 14% 84%); border-radius: 20px; overflow: hidden; height: 40px">

<button role="radio" aria-checked="false" style="border: none; border-right: 1px solid hsl(38 14% 84%); background: transparent; color: hsl(38 15% 11%); font-size: 14px; font-weight: 600; padding: 0">Done</button>

<button role="radio" aria-checked="true" style="border: none; border-right: 1px solid hsl(38 14% 84%); background: hsl(215 48% 82%); color: hsl(215 50% 24%); font-size: 14px; font-weight: 600; padding: 0">Partial</button>

<button role="radio" aria-checked="false" style="border: none; border-right: 1px solid hsl(38 14% 84%); background: transparent; color: hsl(38 15% 11%); font-size: 14px; font-weight: 600; padding: 0">Skip</button>

</div>


<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="One page less" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: hsl(38 28% 91%); color: hsl(38 15% 11%); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<div class="h" style="font-size: 40px; font-weight: 600; line-height: 1">8<span style="font-size: 22px; color: hsl(38 8% 36%)"> / 20</span></div>
<div style="font-size: 14px; font-weight: 600; color: hsl(38 8% 36%); margin-top: 4px">pages · 40%</div>
</div>
<button aria-label="One page more" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: hsl(38 28% 91%); color: hsl(38 15% 11%); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div style="position: relative; height: 48px; display: flex; align-items: center; gap: 6px">
<div style="height: 16px; width: calc(0.4 * (100% - 10px - 40px)); flex-shrink: 0; border-radius: 8px 3px 3px 8px; background: hsl(215 48% 40%)"></div>
<div style="width: 4px; height: 44px; flex-shrink: 0; border-radius: 2px; background: hsl(215 48% 40%)"></div>
<div style="flex-grow: 1; height: 16px; border-radius: 3px 8px 8px 3px; background: hsl(215 55% 92%); display: flex; align-items: center; justify-content: space-around; padding: 0 4px">
<span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 82%)"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: hsl(215 48% 40%)"></span>
</div>
<input type="range" aria-label="Pages read" min="0" max="20" step="1" value="8" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
</div>
</div>


<label style="display: flex; flex-direction: column; gap: 8px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Note</span>
<textarea rows="2" placeholder="Add a note" style="border: 1px solid hsl(38 14% 84%); border-radius: 16px; padding: 12px 14px; font-size: 16px; resize: none; background: hsl(38 30% 96%); color: hsl(38 15% 11%)">Only 8 pages, fell asleep. Start before 10 PM.</textarea>
</label>

<div style="display: flex; gap: 12px; justify-content: flex-end">
<a href="#" style="height: 44px; padding: 0 20px; border-radius: 22px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: hsl(38 48% 30%)">Cancel</a>
<a href="#" style="height: 44px; padding: 0 28px; border-radius: 22px; display: flex; align-items: center; font-size: 14px; font-weight: 600; background: hsl(38 48% 30%); color: #ffffff">Save</a>
</div>
</div>
</div>

</body></html>
