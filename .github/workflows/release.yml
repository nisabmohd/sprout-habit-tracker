name: Release

# Push a tag like v1.0.0 to build signed APKs and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testGithubReleaseUnitTest :app:testPlayReleaseUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPROUT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing SPROUT_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SPROUT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          SPROUT_KEYSTORE_PASSWORD: ${{ secrets.SPROUT_KEYSTORE_PASSWORD }}
          SPROUT_KEY_ALIAS: ${{ secrets.SPROUT_KEY_ALIAS }}
          SPROUT_KEY_PASSWORD: ${{ secrets.SPROUT_KEY_PASSWORD }}
        # github = the APK for GitHub Releases (checks here for updates). F-Droid builds foss itself.
        run: ./gradlew :app:assembleGithubRelease :app:assemblePlayRelease

      - name: Rename and verify
        run: |
          mkdir dist
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/sprout-${GITHUB_REF_NAME}-github.apk"
          cp app/build/outputs/apk/play/release/app-play-release.apk "dist/sprout-${GITHUB_REF_NAME}-play.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do "$APKSIGNER" verify --print-certs "$apk" | head -3; done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # The notes are this version's CHANGELOG.md section; the app shows its "- " lines as What's new.
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Sprout $GITHUB_REF_NAME" --notes-file notes.md
